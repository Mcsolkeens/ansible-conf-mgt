# tasks file for webserver

---
# tasks file for webserver


- name: install apache
  become: true
  ansible.builtin.yum:
    name: httpd
    state: present

- name: install php and required extensions
  become: true
  ansible.builtin.yum:
    name:
      - php
      - php-mysqlnd
    state: present

- name: install git
  become: true
  ansible.builtin.yum:
    name: git
    state: present

- name: set DirectoryIndex to prefer index.php
  become: true
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^DirectoryIndex'
    line: 'DirectoryIndex index.php index.html'
  notify: restart apache

- name: clone tooling repo to staging directory
  become: true
  ansible.builtin.git:
    repo: "https://github.com/Mcsolkeens/tooling.git"
    dest: /home/ec2-user/tooling
    force: yes
    update: false

- name: deploy tooling website content to webroot
  become: true
  ansible.builtin.command: cp -r /home/ec2-user/tooling/html/. /var/www/html/
  args:
    creates: /var/www/html/index.php

- name: ensure webroot ownership and permissions
  become: true
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: apache
    group: apache
    mode: 'u=rwX,g=rX,o=rX'
    recurse: true

- name: patch database hostname in functions.php
  become: true
  ansible.builtin.replace:
    path: /var/www/html/functions.php
    regexp: "mysql\\.tooling\\.svc\\.cluster\\.local"
    replace: "10.0.7.123"

- name: ensure httpd is started and enabled
  become: true
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: yes













































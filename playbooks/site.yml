---
#- import_playbook: ../static-assignments/common.yml
#- import_playbook: ../static-assignments/uat-webservers.yml






- name: Load environment variables
  hosts: all
  gather_facts: false
  tasks:
    - name: Load selected environment configuration
      ansible.builtin.include_tasks: ../dynamic-assignments/env-vars.yml
      tags:
        - always

- name: Apply common assignment
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Apply common tasks
      ansible.builtin.include_tasks: ../static-assignments/common.yml

- name: Configure webservers
  ansible.builtin.import_playbook: ../static-assignments/uat-webservers.yml

- name: Configure load balancer
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Apply load-balancer configuration on LB hosts only
      ansible.builtin.include_tasks: ../static-assignments/loadbalancers.yml
      when:
        - inventory_hostname in groups.get('lb', [])
        - load_balancer_is_required | default(false) | bool
